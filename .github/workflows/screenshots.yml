name: Screenshot Monitor

on:
  schedule:
    # Una vez al día, 10:07 hora del centro de México (16:07 UTC). No va en punto porque GitHub
    # puede descartar los procesos programados a la hora en punto cuando está saturado.
    - cron: '7 16 * * *'
    # Respaldos (11:37 y 13:13): solo toman capturas si ese día todavía no hay testigos.
    - cron: '37 17 * * *'
    - cron: '13 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.revisar.outputs.correr }}
    steps:
      - id: revisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Corrida a mano: siempre toma capturas.
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          hoy=$(TZ=America/Mexico_City date +%F)
          # GitHub a veces arranca los programados con horas de retraso: fuera de 9:00 a 16:59
          # (hora del centro) no se toman capturas, para que no salgan de noche.
          hora=$(TZ=America/Mexico_City date +%-H)
          if [ "$hora" -lt 9 ] || [ "$hora" -gt 16 ]; then
            echo "Llegó tarde (son las $hora h en México): no se toman capturas."
            echo "correr=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hechas=$(gh run list -R "${{ github.repository }}" --workflow screenshots.yml --status success --limit 20 \
            --json createdAt,databaseId \
            | jq --arg hoy "$hoy" --argjson yo "${{ github.run_id }}" \
              '[.[] | select(.databaseId != $yo) | select((.createdAt | fromdateiso8601 - 21600 | strftime("%Y-%m-%d")) == $hoy)] | length')
          echo "Corridas exitosas hoy ($hoy): $hechas"
          if [ "$hechas" -gt 0 ]; then echo "correr=no" >> "$GITHUB_OUTPUT"; else echo "correr=si" >> "$GITHUB_OUTPUT"; fi

  screenshots:
    needs: revisar
    if: needs.revisar.outputs.correr == 'si'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear entorno Puppeteer aislado
        run: |
          mkdir -p /tmp/puppeteer-runner
          cd /tmp/puppeteer-runner
          npm init -y
          npm install puppeteer --legacy-peer-deps

      - name: Tomar testigos de los banners activos
        env:
          NODE_PATH: /tmp/puppeteer-runner/node_modules
        run: node screenshots.js

      - name: Fecha
        id: fecha
        run: echo "hoy=$(TZ=America/Mexico_City date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: testigos-${{ steps.fecha.outputs.hoy }}
          path: screenshots/
          retention-days: 90

      # GitHub apaga los procesos programados si el repo pasa 60 días sin cambios.
      # Cuando han pasado 45 días desde el último cambio se anota la corrida para que no se vuelva a apagar.
      - name: Mantener activo el proceso
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > ultima-corrida.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add ultima-corrida.txt
            git commit -m "Mantener activo el monitor de testigos"
            git push
          fi
